{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
<section class="painel painel--estreito">
  <h1>Entrar</h1>
  {% if next %}<p class="texto-suave">Entre na sua conta para continuar.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "partials/_form_campos.html" %}
    <button class="botao botao--largo" type="submit">Entrar</button>
  </form>
  <p class="painel__rodape">Ainda não tem conta? <a href="{% url 'contas:cadastro' %}">Crie a sua</a>.</p>
</section>
{% endblock %}
